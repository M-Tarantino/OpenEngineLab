<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenEngineLab — Engine Physics Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/[email protected]/dist/uPlot.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Open<span>Engine</span>Lab</div>
  <div class="topbar-controls">
    <select id="discipline-select" class="topbar-select" aria-label="Discipline"></select>
    <select id="lang-select" class="topbar-select" aria-label="Language">
      <option value="de">DE</option><option value="en">EN</option>
      <option value="fr">FR</option><option value="es">ES</option>
    </select>
    <button id="undo-btn" class="icon-btn" title="Undo">↶</button>
    <button id="redo-btn" class="icon-btn" title="Redo">↷</button>
    <button id="save-setup-btn" class="icon-btn-text" title="Save Setup (.oel)">💾</button>
    <button id="load-setup-btn" class="icon-btn-text" title="Load Setup (.oel)">📂</button>
    <input type="file" id="load-setup-input" accept=".oel,application/json" style="display:none">
    <button id="csv-export-btn" class="icon-btn-text" title="Export CSV">📊</button>
    <button id="report-btn" class="icon-btn-text" title="Report">📄</button>
    <a href="Json.html" id="json-editor-link" class="icon-btn-text" title="JSON Editor">🧩 JSON</a>
    <div class="tabs" role="tablist">
      <button id="tab-schematic" class="tab-btn active" role="tab" aria-selected="true">Schematic</button>
      <button id="tab-kennfield" class="tab-btn" role="tab" aria-selected="false">Fuel Map</button>
      <button id="tab-launch" class="tab-btn" role="tab" aria-selected="false">Launch</button>
      <button id="tab-compare" class="tab-btn" role="tab" aria-selected="false">Compare</button>
    </div>
  </div>
</header>

<main class="app-grid">
  <aside id="left-panel" class="sidebar sidebar-left" aria-label="Input panel"></aside>

  <section class="viewport">
    <div id="schematic-container" class="schematic-container" aria-label="Engine schematic"></div>
    <button id="dyno-test-btn" class="dyno-test-btn" title="Run a standardized wide-open-throttle dyno pull">▶ Dyno Test</button>
    <div id="dyno-test-panel" class="dyno-test-panel" style="display:none"></div>
    <div id="kennfield-view" class="kennfield-view" style="display:none">
      <div class="kennfield-toolbar">
        <label for="kennfield-select">Fuel Map</label>
        <select id="kennfield-select">
          <option value="ignition">Ignition Timing (° BTDC)</option>
          <option value="fuel">Fuel Quantity (mg/cycle)</option>
        </select>
      </div>
      <canvas id="kennfield-canvas" width="640" height="360"></canvas>
    </div>
    <div id="launch-view" class="launch-view" style="display:none"></div>
    <div id="compare-view" class="compare-view" style="display:none"></div>
    <div id="tooltip" class="tooltip" role="tooltip"></div>
    <div id="hydrolock-banner" class="hydrolock-banner" style="display:none">
      <div class="hydrolock-text"></div>
      <button id="rebuild-engine-btn" class="rebuild-btn"></button>
    </div>
  </section>

  <aside class="sidebar sidebar-right" aria-label="Live data">
    <h2>Telemetry</h2>
    <div id="live-readout" class="live-readout"></div>
    <div id="chart-a" class="chart"></div>
    <div id="chart-b" class="chart"></div>
    <h3>Statistics (min / avg / max)</h3>
    <div id="stats-panel" class="stats-panel"></div>
  </aside>

  <footer class="status-bar">
    <span id="status-state" class="ok">RUNNING</span>
    <span id="status-time">t=0.0s</span>
    <span id="status-weakest" class="ok">Weakest Link: —</span>
    <span id="status-drivetrain" class="drivetrain-status"></span>
    <span id="status-advisory" class="advisory"></span>
    <span id="status-flash" class="flash-msg"></span>
    <button id="estop" class="estop-btn" title="Emergency stop: immediate reset to a safe state">E-STOP</button>
  </footer>
</main>

<script src="https://unpkg.com/[email protected]/dist/uPlot.iife.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="js/ecm.js"></script>
<script src="js/renderer.js"></script>
<script src="js/track.js"></script>
<script src="js/disciplines.js"></script>
<script src="js/report.js"></script>
<script src="js/mods.js"></script>
<script src="js/benchmark.js"></script>
<script src="js/setup-io.js"></script>
<script src="js/comparison.js"></script>
<script src="js/realism-check.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
